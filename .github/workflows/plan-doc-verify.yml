name: Plan doc verify

on:
  push:
    branches: [main, master]
    paths:
      - 'PROBE_BUILD_PLAN.md'
      - 'BUILD_PLAN.md'
      - 'KNOWLEDGE_BASE.md'
      - 'AGENT_MEMORY.md'
      - 'PROMPT_LIBRARY.md'
      - 'CONTRIBUTING.md'
      - 'PRIVACY.md'
      - 'SECURITY.md'
      - 'DECISION_LOG.md'
      - 'docs/adr/**'
      - 'docs/VISUAL_REGRESSION_POLICY.md'
      - 'docs/PNS_TECHNICAL_SETTINGS.md'
      - 'CAPTURE_ARCHITECTURE.md'
      - 'PERFORMANCE_BUDGETS.md'
      - 'STORAGE_STRATEGY.md'
      - 'metadata/**'
  pull_request:
    paths:
      - 'PROBE_BUILD_PLAN.md'
      - 'BUILD_PLAN.md'
      - 'KNOWLEDGE_BASE.md'
      - 'AGENT_MEMORY.md'
      - 'PROMPT_LIBRARY.md'
      - 'CONTRIBUTING.md'
      - 'PRIVACY.md'
      - 'SECURITY.md'
      - 'DECISION_LOG.md'
      - 'docs/adr/**'
      - 'docs/VISUAL_REGRESSION_POLICY.md'
      - 'docs/PNS_TECHNICAL_SETTINGS.md'
      - 'CAPTURE_ARCHITECTURE.md'
      - 'PERFORMANCE_BUDGETS.md'
      - 'STORAGE_STRATEGY.md'
      - 'metadata/**'

concurrency:
  group: plan-doc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  skipgradle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: SkipGradle (scripts + Kotlin UTF-8 scan)
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}"
          ./scripts/pns_verify_toolchain.ps1 -SkipGradle
