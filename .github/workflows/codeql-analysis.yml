name: CodeQL

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'modules/**'
      - 'scripts/**'
      - 'tests/fixtures/**'
      - 'native/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/codeql-analysis.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'modules/**'
      - 'scripts/**'
      - 'tests/fixtures/**'
      - 'native/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/codeql-analysis.yml'
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Java/Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          tools: latest
          build-mode: manual

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Write local.properties for Gradle (sdk.dir)
        run: echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Install Android platform and NDK (match toolchain-verify)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "ndk;26.3.11579264" "cmake;3.22.1"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Gradle wrapper executable
        run: chmod +x ./gradlew

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Kotlin pin below changes compiler ABI; stale cache causes ClasspathEntrySnapshotTransform failures.
          cache-disabled: true

      # CodeQL supports Kotlin < 2.3.30; ship Kotlin 2.4.0 on main (github/codeql#21938).
      - name: Pin Kotlin 2.3.21 for CodeQL build only
        run: sed -i 's/kotlin = "2.4.0"/kotlin = "2.3.21"/g' gradle/libs.versions.toml

      - name: Build debug APK for CodeQL extraction
        run: ./gradlew clean :app:assembleDebug --no-daemon --no-build-cache -PpnsSkipDependencyLocking=true

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:java'
