# Gitleaks configuration — Milestone T Sprint T.5
# Docs: https://github.com/gitleaks/gitleaks

title = "Point & Shoot gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known non-secret paths and documentation examples"

paths = [
  '''(?i)scripts/pns_adb_device\.env\.example''',
  '''(?i)tests/fixtures/''',
  '''(?i)docs/''',
  '''(?i)AGENTS\.md''',
  '''(?i)BUILD_PLAN.*\.md''',
  '''(?i)BUILD_PLAN_COMPLETED\.md''',
  '''(?i)PROBE_BUILD_PLAN\.md''',
  '''(?i)CHANGELOG\.md''',
  '''(?i)\.cursor/skills/''',
  '''(?i)scripts/pns_github_secrets_set\.ps1''',
  '''(?i)scripts/pns_gitlab_setup\.ps1''',
  '''(?i)scripts/pns_keystore_verify\.ps1''',
  '''(?i)keystore\.properties\.example''',
  # Scheduled Security scan false positives (generic-api-key on SharedPreferences
  # name / LUT format heuristics — not credentials). Historical app/ path kept for
  # gitleaks history scan after Sprint TM move to modules/pns-fleet.
  '''(?i)(app/src/main/java/dev/pointandshoot/fleet/|modules/pns-fleet/.*/)FleetPolicyPreferences\.kt''',
  '''(?i).*/LutImportValidator\.kt''',
]

regexTarget = "match"
regexes = [
  '''(?i)example.*serial''',
  '''(?i)ANDROID_KEYSTORE_BASE64''',
  '''(?i)placeholder''',
  '''(?i)<your-username>''',
]
