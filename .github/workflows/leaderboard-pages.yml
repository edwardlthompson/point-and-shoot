name: Leaderboard Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/leaderboard/**'
      - 'docs/index.html'
      - 'docs/.nojekyll'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  antutu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scrape AnTuTu (non-blocking)
        run: python scripts/antutu_ranking_scrape.py || true
      - name: Scrape GSMArena sensors (non-blocking)
        run: python scripts/gsmarena_sensor_scrape.py || true
      - name: Scrape GSMArena device specs (non-blocking)
        run: python scripts/gsmarena_device_specs_scrape.py || true

  deploy:
    needs: antutu
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
