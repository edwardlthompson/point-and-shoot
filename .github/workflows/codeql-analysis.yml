name: CodeQL

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'modules/**'
      - 'scripts/**'
      - 'tests/fixtures/**'
      - 'native/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/codeql-analysis.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'modules/**'
      - 'scripts/**'
      - 'tests/fixtures/**'
      - 'native/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/codeql-analysis.yml'
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Java/Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Write local.properties for Gradle (sdk.dir)
        run: echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Install Android platform and NDK (match toolchain-verify)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Gradle wrapper executable
        run: chmod +x ./gradlew

      - uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK for CodeQL extraction
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:java'
