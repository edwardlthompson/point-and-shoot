name: Toolchain verify

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'gradle/**'
      - 'native/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'gradle/**'
      - 'native/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  workflow_dispatch:

concurrency:
  group: toolchain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  toolchain-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android platform (compileSdk 36)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36"

      - name: Gradle wrapper executable (Unix)
        run: chmod +x ./gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Run pns_verify_toolchain.ps1 (assembleDebug + dep-audit + UTF-8 + parse)
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}"
          ./scripts/pns_verify_toolchain.ps1

      - name: Run JVM unit tests (:app:testDebugUnitTest)
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload unit-test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pns-unit-test-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pns-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
