name: Leaderboard submission validate

on:
  pull_request:
    paths:
      - 'docs/leaderboard/submissions/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate submissions
        run: python scripts/leaderboard_submission_validate.py
