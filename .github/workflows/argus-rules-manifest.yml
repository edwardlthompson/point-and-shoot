name: Argus rules manifest

on:
  push:
    branches: [main]
    paths:
      - "argus/rules/**"
      - "argus.contract.json"
      - "scripts/publish-argus-rules-manifest.py"
      - "scripts/lib/publish_rules_manifest.py"

permissions:
  contents: write

jobs:
  publish:
    name: Publish rules.manifest.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build manifest
        run: python3 scripts/publish-argus-rules-manifest.py
      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet rules.manifest.json; then
            echo "No manifest changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules.manifest.json
          git commit -m "chore(argus): publish rules.manifest.json"
          git push
